<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframes</title>
</head>
<body>

 <!-- open in iframe -->
  <h1>links</h1>
  <a target="_parent" href="https://example.com/">example.com</a>
  <a target="_parent" href="./links.html">inner links.com</a>
   
     <h1>iframes</h1>
     <iframe  height="100px" width="400px" frameborder="2px" src="./links.html" ></iframe>
     <iframe name="frame1" height="400px" frameborder="2px"   width="400px" frameborder="0px" src="https://example.com/" ></iframe>
     <h1>example iframes from diff website </h1>
     
</body>
</html>
